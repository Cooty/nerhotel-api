name: Deploy Worker

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/Jod"

      - name: Install dependencies
        run: npm ci --fund=false --audit=false

      - name: Extract Commit Message Title
        id: commit
        run: |
          # Grabs the first line of the commit message
          TITLE=$(echo "${{ github.event.head_commit.message }}" | head -n 1)
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --message "${{ steps.commit.outputs.title }}"
